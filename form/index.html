<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>訂閱群組簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --line:#E1E5E0; --ink:#18201C; --soft:#5D6863;
  --jade:#17795C; --jade-d:#11624A; --jade-l:#E2F3EB;
  --red:#C62828; --red-l:#FCEBEB; --orange:#E8590C; --amber:#B7791F; --amber-l:#FFF5D6; --gray:#4B5563; --gray-l:#ECEFEC;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
a{color:var(--jade)}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
[hidden]{display:none!important}

/* 登入 */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:min(400px,100%);text-align:center}
.logo{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:12px;background:var(--jade);color:#fff;font-size:26px;font-weight:700}
.login-card h1{font-size:24px}
.login-card p{color:var(--soft);margin:8px 0 20px}
.login-card .err{color:var(--red);margin:14px 0 0;font-size:14px}

/* 頂部與分頁 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(14px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--jade);color:#fff;font-size:16px}
.top-r{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
#conn{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{background:var(--amber-l);border-bottom:1px solid #E6C56A;padding:8px clamp(14px,3vw,28px);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 clamp(8px,2vw,22px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tab{display:flex;align-items:center;gap:8px;flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;cursor:pointer;color:var(--soft);font-weight:500;min-height:48px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--jade)}
.tab .cnt{font-size:13px;color:var(--soft);font-weight:400}
.tab .flag{background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.tab.add{color:var(--jade)}
.main{padding:22px clamp(14px,3vw,28px) 90px;max-width:1080px;margin:0 auto}

/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;background:var(--surface);border:1px solid #C6CCC7;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--gray-l)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.primary:hover{background:var(--jade-d)}
.btn.danger{color:var(--red);border-color:#E7B5B5}
.btn.danger:hover{background:var(--red-l)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.big{min-height:48px;width:100%;font-size:16px}
input,select,textarea{background:#fff;border:1px solid #B9C0BA;border-radius:8px;padding:9px 11px;width:100%;font-size:16px}
textarea{resize:vertical}
label{display:block}
.lbl{display:block;font-size:13px;color:var(--soft);margin-bottom:3px}
.form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.hint{margin:0;font-size:13px;color:var(--soft)}
.twd{margin:0;font-weight:700}
.foot{display:flex;justify-content:flex-end;gap:10px;padding-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* 標題 */
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.head h1{font-size:clamp(22px,4vw,28px);font-weight:700}
.head .note{margin:4px 0 0;color:var(--soft)}
.head .btns{display:flex;flex-wrap:wrap;gap:8px}
.fees{display:flex;flex-wrap:wrap;gap:4px 22px;margin:8px 0 0}
.fee em{font-style:normal;color:var(--soft);margin-right:6px}
.fee b{font-weight:700}
.fee small{color:var(--soft);margin-left:6px}
.summary{margin:6px 0 0;color:var(--soft);font-size:14px}

/* 數字方塊 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 4px}
.tile{--tone:var(--jade);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tone);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-size:26px;line-height:1.25}
.tile.money b{font-size:19px;line-height:2}
.tile span{color:var(--soft);font-size:13px}
.tile.red{--tone:var(--red)} .tile.amber{--tone:var(--amber)} .tile.gray{--tone:var(--gray)}
@media(max-width:640px){.tiles{grid-template-columns:1fr 1fr}}

/* 篩選 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:500}
.chip b{font-weight:700;color:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:#fff}
.chip.warn:not(.on){border-color:#E7B5B5;color:var(--red)}
.chip.warn:not(.on) b{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px}
.tools .chips{flex:1 1 auto}
.tools input{flex:0 1 240px;min-height:42px}

/* 成員列表 */
.section-title{font-size:18px;font-weight:700;margin:26px 0 4px}
.section-sub{margin:0 0 10px;color:var(--soft);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{--tone:var(--jade);display:grid;grid-template-columns:104px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 16px 12px 12px;border-left:5px solid var(--tone);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.hd{background:var(--gray-l);color:var(--soft);font-size:13px;padding-top:8px;padding-bottom:8px;border-left-color:transparent}
.row.today{--tone:var(--red)} .row.tomorrow{--tone:var(--orange)} .row.expired{--tone:var(--gray)}
.row.soon{--tone:var(--amber)} .row.ok{--tone:var(--jade)} .row.archived{--tone:#B9C0BA;background:#FAFBFA}
.c-nm b,.c-ex b{font-size:16px}
.sub{display:block;font-size:13px;color:var(--soft)}
.sub.today,.sub.tomorrow,.sub.expired{color:var(--red);font-weight:700}
.sub.soon{color:var(--amber);font-weight:700}
.sub.ok{color:var(--jade)}
.grp{display:inline-block;background:var(--gray-l);color:var(--ink);border-radius:4px;padding:0 6px;margin-left:6px}
.c-ac{display:flex;gap:6px;justify-content:flex-end}
.panel{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 12px;font-size:14px}
.kv dt{color:var(--soft)}
.kv dd{margin:0;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{background:var(--surface);border:1.5px dashed #C6CCC7;border-radius:10px;padding:26px 18px;text-align:center;color:var(--soft)}
.empty .btn{margin-top:10px}

.badge{display:inline-block;min-width:80px;text-align:center;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.b-today{background:var(--red);color:#fff}
.b-tomorrow{background:var(--orange);color:#fff}
.b-expired{background:var(--gray);color:#fff}
.b-soon{background:var(--amber-l);color:#7A4E00;box-shadow:inset 0 0 0 1px #E6C56A}
.b-ok{background:var(--jade-l);color:var(--jade-d)}
.b-arch{background:var(--gray-l);color:var(--soft)}

@media(max-width:720px){
  .row{grid-template-columns:1fr auto;grid-template-areas:"st ac" "nm nm" "pl ex";padding:12px 12px 12px 10px}
  .row.hd{display:none}
  .c-st{grid-area:st}.c-ac{grid-area:ac}.c-nm{grid-area:nm}.c-pl{grid-area:pl}.c-ex{grid-area:ex;text-align:right}
  .tools input{flex:1 1 100%}
}

/* 訂閱申請 */
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--amber-l);border:1px solid #E6C56A;border-radius:10px;padding:10px 14px;margin:16px 0 0}
.notice.info{margin:0;font-size:14px}
.req{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.req.confirmed{border-left-color:var(--jade)} .req.rejected{border-left-color:#B9C0BA}
.req-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.req-top b{font-size:17px}
.req .kv{margin-bottom:10px}
.warnTxt{color:var(--red);font-weight:700;margin-left:6px}
.pubtag{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 10px;border-radius:6px;background:var(--jade-l);color:var(--jade-d);font-size:13px;font-weight:700}
.chk{display:flex;align-items:center;gap:10px}
.chk input{width:auto;min-width:20px;height:20px}
/* 對話框 */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:92vh;border-radius:14px;overflow:auto}
dialog::backdrop{background:rgba(24,32,28,.5)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:18px;font-weight:700}
.x{background:none;border:0;font-size:20px;cursor:pointer;width:40px;height:40px;color:var(--soft)}
.dlg-body{padding:16px 18px 20px}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:14px 14px 0 0;border-width:1px 0 0}}
.pay-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.pay-row:first-child{border-top:0}
.pay-row .sub{display:block}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:calc(100vw - 24px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast button{background:none;border:0;color:#8FE0BD;font-weight:700;cursor:pointer;padding:4px 2px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login-card">
    <div class="logo" aria-hidden="true">訂</div>
    <h1>訂閱群組簿</h1>
    <p>請使用授權的 Google 帳號登入。</p>
    <button class="btn primary big" data-act="login">使用 Google 登入</button>
    <p id="login-msg" class="err" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">訂</span>訂閱群組簿</div>
    <div class="top-r">
      <span id="conn"></span>
      <button class="btn sm" data-act="settings">設定</button>
      <button class="btn sm ghost" id="logout" data-act="logout" hidden>登出</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" id="tabs" aria-label="群組"></nav>
  <main class="main" id="main"></main>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlg-title"></h2><button class="x" data-act="close" aria-label="關閉">✕</button></div>
  <div id="dlg-body" class="dlg-body"></div>
</dialog>

<dialog id="confirm">
  <div class="dlg-body">
    <div id="confirm-body"></div>
    <div class="foot"><button class="btn" id="confirm-cancel">取消</button><button class="btn danger" id="confirm-ok">確定</button></div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script type="module">
/* =====================================================================
   1. Firebase 設定：新開專案後，把下面的值換成你自己的
      （Firebase 主控台 → 專案設定 → 一般 → 你的應用程式 → 網頁應用程式）
      沒有填寫時，網站會用「本機示範模式」，資料只存在這個瀏覽器，且不需登入。

   登入設定（填好 FIREBASE_CONFIG 之後）：
     a. Authentication → 開始使用 → 登入方式 → 啟用「Google」
     b. Authentication → 設定 → 授權網域 → 新增 wangchiapin.github.io
     c. 把你的 Gmail 填進下面的 ALLOWED_EMAILS
     d. Firestore → 規則，貼上這段（把信箱換成你的）：
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if request.auth != null
                  && request.auth.token.email == 'you@gmail.com'
                  && request.auth.token.email_verified == true;
              }
            }
          }
      Apps Script 用你的 Google 帳號權限讀資料，不受這個規則影響。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const ALLOWED_EMAILS = ["YOUR_EMAIL@gmail.com"]; // 允許登入的信箱；可放多個
// Firestore 集合名稱（Apps Script 通知程式也會讀，要一致）
const COLL = { groups: "sub_groups", members: "sub_members", settings: "sub_settings", requests: "sub_requests" };

const FIREBASE_READY = !String(FIREBASE_CONFIG.apiKey).startsWith("YOUR_");
const allowList = ALLOWED_EMAILS.filter(e => e && !e.startsWith("YOUR_")).map(e => e.toLowerCase());
const isAllowed = email => !allowList.length || allowList.includes(String(email || "").toLowerCase());

/* =====================================================================
   2. 常數與日期工具
   ===================================================================== */
const PLANS = {
  monthly:   { label: "每月", months: 1 },
  bimonthly: { label: "雙月", months: 2 },
  quarterly: { label: "每季", months: 3 }
};
const CUR = {
  TWD: { sym: "NT$", name: "台幣" },
  USD: { sym: "US$", name: "美金" },
  MXN: { sym: "MX$", name: "墨西哥披索" }
};
const DEFAULT_RATES = { USD: 32, MXN: 1.7 }; // 1 單位外幣 = 多少台幣（到「設定」改成你要的預設值）

const pad = n => String(n).padStart(2, "0");
const fmt = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parseYMD = s => { const [y, m, d] = s.split("-").map(Number); return { y, m, d }; };
const daysInMonth = (y, m) => new Date(y, m, 0).getDate(); // m: 1-12
/* 加月份：目標月份沒有該日就取當月最後一天；一律以原始日（anchorDay）計算，避免越算越早 */
function addMonths(s, n, anchorDay) {
  const { y, m, d } = parseYMD(s);
  const day = anchorDay || d;
  const total = y * 12 + (m - 1) + n;
  const ny = Math.floor(total / 12), nm = (total % 12) + 1;
  return fmt(ny, nm, Math.min(day, daysInMonth(ny, nm)));
}
function addDays(s, n) {
  const { y, m, d } = parseYMD(s);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return fmt(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
}
function daysBetween(a, b) {
  const A = parseYMD(a), B = parseYMD(b);
  return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000);
}
const todayStr = () => { const d = new Date(); return fmt(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const nowLocal = () => { const d = new Date(); return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayOf = s => Number(s.slice(8, 10));

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = o => JSON.parse(JSON.stringify(o));
const money = (n, c) => `${CUR[c].sym} ${Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 })}`;
const toTWD = (amt, cur, rate) => cur === "TWD" ? Math.round(amt) : Math.round(amt * rate);

/* =====================================================================
   3. 資料層：Firestore（含登入）或本機，介面相同
   ===================================================================== */
const LS_KEY = "subgroup-manager-v1";
const local = {
  mode: "local",
  data: { groups: [], members: [], requests: [], settings: null },
  async start(cb) {
    this.cb = cb;
    try { const raw = localStorage.getItem(LS_KEY); if (raw) this.data = JSON.parse(raw); } catch (e) {}
    this.data.groups ||= []; this.data.members ||= []; this.data.requests ||= [];
    cb(this.data);
  },
  persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) {} this.cb(this.data); },
  async put(kind, obj) {
    obj = clean(obj);
    if (kind === "settings") this.data.settings = obj;
    else {
      const arr = this.data[kind], i = arr.findIndex(x => x.id === obj.id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
    }
    this.persist();
  },
  async remove(kind, ids) {
    ids = [].concat(ids);
    this.data[kind] = this.data[kind].filter(x => !ids.includes(x.id));
    this.persist();
  }
};

async function makeFirestore() {
  const V = "10.12.2";
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const db = fs.getFirestore(app), auth = au.getAuth(app);
  const data = { groups: [], members: [], requests: [], settings: null };
  let unsubs = [], emitCb = null;
  const api = {
    mode: "firebase",
    onAuth: cb => au.onAuthStateChanged(auth, cb),
    async signIn() {
      const p = new au.GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      try { await au.signInWithPopup(auth, p); }
      catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return au.signInWithRedirect(auth, p);
        throw e;
      }
    },
    signOut: () => au.signOut(auth),
    start(cb) {
      api.stop(); emitCb = cb;
      const emit = () => cb(data);
      const onErr = err => { console.error(err); toast(err.code === "permission-denied" ? "沒有讀寫權限，請確認 Firestore 規則與登入帳號" : "讀取資料失敗"); };
      unsubs = [
        fs.onSnapshot(fs.collection(db, COLL.groups), snap => { data.groups = snap.docs.map(d => ({ ...d.data(), id: d.id })); emit(); }, onErr),
        fs.onSnapshot(fs.collection(db, COLL.members), snap => { data.members = snap.docs.map(d => ({ ...d.data(), id: d.id })); emit(); }, onErr),
        fs.onSnapshot(fs.collection(db, COLL.requests), snap => { data.requests = snap.docs.map(d => ({ ...d.data(), id: d.id })); emit(); }, onErr),
        fs.onSnapshot(fs.doc(db, COLL.settings, "main"), snap => { data.settings = snap.exists() ? snap.data() : null; emit(); }, onErr)
      ];
    },
    stop() {
      unsubs.forEach(u => u()); unsubs = [];
      data.groups = []; data.members = []; data.requests = []; data.settings = null;
      if (emitCb) emitCb(data);
    },
    async put(kind, obj) {
      obj = clean(obj);
      if (kind === "settings") return fs.setDoc(fs.doc(db, COLL.settings, "main"), obj);
      const { id, ...rest } = obj;
      return fs.setDoc(fs.doc(db, COLL[kind], id), rest);
    },
    async remove(kind, ids) {
      const b = fs.writeBatch(db);
      [].concat(ids).forEach(id => b.delete(fs.doc(db, COLL[kind], id)));
      return b.commit();
    }
  };
  return api;
}

/* =====================================================================
   4. 狀態與計算
   ===================================================================== */
const state = { groups: [], members: [], requests: [], reqFilter: "pending", settings: { rates: { ...DEFAULT_RATES } }, view: "overview", groupId: null, q: "", filter: "all", mode: "local", user: null, loginMsg: "", open: new Set() };
let store = local;

const mergeSettings = s => ({ rates: { ...DEFAULT_RATES, ...((s && s.rates) || {}) } });
const groupById = id => state.groups.find(g => g.id === id);
const memberById = id => state.members.find(m => m.id === id);
const membersOf = gid => state.members.filter(m => m.groupId === gid);
const liveOf = gid => membersOf(gid).filter(m => !m.archived);
const reqById = id => state.requests.find(r => r.id === id);
const pendingReqs = () => state.requests.filter(r => r.status === "pending");
const matchMember = r => r.email ? state.members.find(m => m.groupId === r.groupId && String(m.email || "").toLowerCase() === String(r.email).toLowerCase()) : null;
const normRef = x => String(x || "").trim().toLowerCase();
function dupRef(r) {
  const k = normRef(r.ref); if (!k) return false;
  return state.requests.some(o => o.id !== r.id && normRef(o.ref) === k) || state.members.some(m => (m.payments || []).some(p => normRef(p.ref) === k));
}
const waLink = n => { const d = String(n || "").replace(/\D/g, ""); return d ? `<a href="https://wa.me/${d}" target="_blank" rel="noopener">${esc(n)}</a>` : "未填"; };
const fmtTs = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${todayStrOf(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayStrOf = d => fmt(d.getFullYear(), d.getMonth() + 1, d.getDate());
const METHODS = { paypal: { label: "PayPal", ref: "PayPal 交易編號" }, mx_bank: { label: "墨西哥銀行轉帳", ref: "SPEI 追蹤碼" } };
async function markReq(r, status, memberId) {
  const o = { ...r, status, handledAt: todayStr() }; if (memberId) o.memberId = memberId;
  await store.put("requests", o);
}
const memberTotal = m => (m.payments || []).reduce((s, p) => s + (Number(p.twd) || 0), 0);
const groupTotal = gid => membersOf(gid).reduce((s, m) => s + memberTotal(m), 0); // 含封存成員的歷史收款
const offeredPlans = g => { const k = Object.keys(PLANS).filter(k => Number(g.prices?.[k]) > 0); return k.length ? k : Object.keys(PLANS); };

/* 到期日當天不算有效：d = 距離到期日的天數 */
function statusOf(m) {
  const d = daysBetween(todayStr(), m.expiresAt);
  if (m.archived) return { key: "archived", tone: "archived", d, label: "已封存", cls: "b-arch", text: m.archivedAt ? `封存於 ${m.archivedAt}` : "已封存" };
  if (d < 0)  return { key: "expired",  tone: "expired",  d, label: "已過期",   cls: "b-expired",  text: `已過期 ${-d} 天` };
  if (d === 0) return { key: "today",    tone: "today",    d, label: "今日到期", cls: "b-today",    text: "今天起停止" };
  if (d === 1) return { key: "tomorrow", tone: "tomorrow", d, label: "明日到期", cls: "b-tomorrow", text: "明天到期" };
  if (d <= 7)  return { key: "soon",     tone: "soon",     d, label: "即將到期", cls: "b-soon",     text: `剩 ${d} 天` };
  return            { key: "ok",       tone: "ok",       d, label: "有效",     cls: "b-ok",       text: `剩 ${d} 天` };
}
/* 篩選分類：arch 封存、attn 需處理（已過期＋今明到期）、soon 7 天內、ok 有效 */
function bucket(m) {
  if (m.archived) return "arch";
  const d = statusOf(m).d;
  return d <= 1 ? "attn" : d <= 7 ? "soon" : "ok";
}
const countBy = ms => ({ all: ms.filter(m => !m.archived).length, attn: ms.filter(m => bucket(m) === "attn").length, soon: ms.filter(m => bucket(m) === "soon").length, ok: ms.filter(m => bucket(m) === "ok").length, arch: ms.filter(m => m.archived).length });

}

function syncPay(f) {
  const cur = f.elements.currency.value, rb = $(".ratebox", f), rate = f.elements.rate;
  rb.hidden = cur === "TWD";
  if (cur !== "TWD" && !rate.dataset.touched) rate.value = state.settings.rates[cur] ?? "";
  const amt = Number(f.elements.amount.value) || 0;
  const r = cur === "TWD" ? 1 : (Number(rate.value) || 0);
  $(".paytwd", f).textContent = amt ? `台幣小計 ${money(toTWD(amt, cur, r), "TWD")}` : "";
}
function readPay(f, extra) {
  const currency = f.elements.currency.value, amount = Number(f.elements.amount.value) || 0;
  const rate = currency === "TWD" ? 1 : (Number(f.elements.rate.value) || state.settings.rates[currency] || 1);
  return { id: uid(), paidAt: f.elements.paidAt.value, amount, currency, rate, twd: toTWD(amount, currency, rate), ...extra };
}
function watchPay(f) {
  f.addEventListener("input", e => {
    const n = e.target.name;
    if (n === "rate") e.target.dataset.touched = "1";
    if (n === "currency") delete f.elements.rate.dataset.touched;
    if (n === "amount") f.elements.amount.dataset.touched = "1";
    syncPay(f);
  });
}

function openRenew(id, opts = {}) {
  const m = memberById(id), g = groupById(m.groupId), req = opts.request || null;
  const keys = [...new Set([req ? req.plan : m.plan, m.plan, ...offeredPlans(g)])];
  const today = todayStr();
  const startDefault = m.expiresAt >= today ? m.expiresAt : today;
  const anchorOf = start => start === m.expiresAt ? (m.anchorDay || dayOf(m.activatedAt)) : dayOf(start);
  openDlg(`續訂：${m.name}`, `<form id="rform" class="form" autocomplete="off">
    <p class="hint">目前到期日 ${esc(m.expiresAt)}，${m.archived ? "已封存" : statusOf(m).text}。${m.archived ? "續訂後會自動移出封存。" : ""}</p>
    <label><span class="lbl">續訂方案</span><select name="plan">${planOptions(keys, req ? req.plan : m.plan)}</select></label>
    ${req ? reqNote(req) : ""}
    <div class="grid2">

      <label><span class="lbl">付費時間</span><input name="paidAt" type="datetime-local" value="${esc(req?.paidAt || nowLocal())}"></label>
    </div>
    <p class="twd" id="newexp"></p>
    <p class="hint" id="newhint"></p>
    ${payBlock(req ? (req.expectedCurrency || g.currency) : g.currency, req ? req.expectedAmount : g.prices?.[m.plan])}
    <div class="foot"><button type="button" class="btn" data-act="close">取消</button><button class="btn primary">確認續訂</button></div>
  </form>`);
  const f = $("#rform"), v = n => f.elements[n].value;
  const newExp = () => addMonths(v("start"), PLANS[v("plan")].months, anchorOf(v("start")));
  const recalc = who => {
    if (who === "plan" && !f.elements.amount.dataset.touched) f.elements.amount.value = g.prices?.[v("plan")] || "";
    const start = v("start");
    if (start) {
      $("#newexp").textContent = `新的到期日 ${newExp()}`;
      $("#newhint").textContent = start === m.expiresAt
        ? "從現有到期日接續，日期不會越算越早。"
        : "起算日不是原本的到期日，之後會以這天的日期為準。";
    }
    syncPay(f);
  };
  watchPay(f);
  if (req) f.elements.amount.dataset.touched = "1";
  f.addEventListener("input", e => recalc(e.target.name));
  recalc();
  f.onsubmit = async e => {
    e.preventDefault();
    const start = v("start"), plan = v("plan"), exp = newExp();
    const pay = readPay(f, { kind: "renew", plan, periodStart: start, periodEnd: exp, ...(req ? { ref: req.ref, method: req.method } : {}) });
    const { archivedAt, ...base } = m;
    const obj = { ...base, archived: false, plan, expiresAt: exp, paidAt: pay.paidAt, anchorDay: anchorOf(start), payments: [...(m.payments || []), pay] };
    closeDlg();
    try { await store.put("members", obj); if (req) await markReq(req, "confirmed", m.id); toast(`已續訂，新的到期日 ${exp}`); } catch (err) { console.error(err); toast("續訂失敗"); }
  };
}

  },
  "go-group": id => { state.view = "group"; state.groupId = id; state.q = ""; state.filter = "all"; render(); window.scrollTo(0, 0); },
  "filter": (id, el) => { state.filter = el.dataset.f; renderTabs(); viewGroup(groupById(state.groupId)); },
  "toggle": (id) => {
    const open = !state.open.has(id); open ? state.open.add(id) : state.open.delete(id);
    const row = document.querySelector(`[data-row="${id}"]`); if (!row) return;
    $(".panel", row).hidden = !open;
    const b = $('[data-act="toggle"]', row); b.textContent = open ? "收起" : "詳情"; b.setAttribute("aria-expanded", open);
  },
  "new-group": () => openGroupForm(),
  "edit-group": () => openGroupForm(state.groupId),
  "del-group": delGroup,
  "new-member": () => openMemberForm(state.groupId),
  "edit-member": id => openMemberForm(memberById(id).groupId, id),
  "del-member": delMember,
  "archive": archiveMember,
  "unarchive": id => unarchiveMember(id, false),
  "renew": openRenew,
  "history": openHistory,
  "settings": openSettings,
  "export": exportJSON,
  "seed": seed,
  "login": doLogin,
  "logout": () => store.signOut(),
  "close": closeDlg
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "del-pay") return delPay(el.dataset.mid, el.dataset.pid);
  actions[el.dataset.act]?.(el.dataset.id, el);
});
document.addEventListener("input", e => { if (e.target.id === "q") { state.q = e.target.value; renderList(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").hidden) render(); }); // 隔天回來時，狀態要重算

/* =====================================================================
   8. 啟動
   ===================================================================== */
(async function boot() {
  let adapter = local;
  if (FIREBASE_READY) {
    try { adapter = await makeFirestore(); }
    catch (e) { console.error(e); state.loginMsg = ""; toast("Firebase 連線失敗，改用本機示範模式"); }
  }
  store = adapter; state.mode = adapter.mode;
  const onData = data => {
    state.groups = (data.groups || []).slice();
    state.members = (data.members || []).slice();
    state.requests = (data.requests || []).slice();
    state.settings = mergeSettings(data.settings);
    render();
  };
  if (adapter.mode === "firebase") {
    showLogin(true);
    adapter.onAuth(async user => {
      if (!user) { adapter.stop(); state.user = null; showLogin(true); return; }
      if (!isAllowed(user.email)) {
        state.loginMsg = `這個帳號（${user.email}）沒有使用權限，請改用授權的帳號登入。`;
        await adapter.signOut(); showLogin(true); return;
      }
      state.user = user; state.loginMsg = ""; showLogin(false); adapter.start(onData);
    });
  } else {
    showLogin(false);
    await adapter.start(onData);
  }
})();
</script>
</body>
</html>
