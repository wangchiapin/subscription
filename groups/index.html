*{box-sizing:border-box}
:root{

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 90px}
.langsw{display:flex;justify-content:flex-end;gap:6px;margin:0 0 8px}
.langsw button{font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.langsw button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}
h1{font-size:28px;line-height:1.25;margin:0 0 8px}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:22px 0 8px}
.lead{margin:0 0 18px;color:var(--soft)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 24px}
@media(max-width:460px){.pick{grid-template-columns:1fr}}
.pick a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pick a:hover{border-color:var(--jade)}
.pick b{display:block;font-size:17px}
.pick small{color:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--jade-l);color:var(--jade-d);margin-bottom:6px}
.tag.soon{background:var(--amber-l);color:#7a5a00}
.tag.wait{background:#FFE4D6;color:#8a3b12}
.tag.closed{background:#eee;color:#555}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin:0 0 22px;scroll-margin-top:12px}
.card .pos{color:var(--soft);margin:0 0 4px}
.hook{background:var(--jade-l);border-radius:12px;padding:14px 16px;margin:14px 0}
.hook p{margin:0 0 8px}.hook p:last-child{margin:0}
.hook strong{color:var(--jade-d)}
ul.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.feat li{display:grid;grid-template-columns:28px 1fr;gap:6px}
ul.feat b{display:block}
ol.rules{margin:0;padding-left:20px;display:grid;gap:10px}
.norefund{background:var(--amber-l);border:1px solid var(--amber);border-radius:10px;padding:10px 12px}
.price{display:grid;gap:6px;margin:6px 0}
.price div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:6px 0}
.price b{white-space:nowrap}
.note{color:var(--soft);font-size:14px;margin:8px 0 0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-block;text-decoration:none;text-align:center;border:1px solid var(--jade);background:var(--jade);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px}
.btn:hover{background:var(--jade-d)}
.btn.ghost{background:#fff;color:var(--jade-d)}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:700}
.faq p{margin:8px 0 0;color:var(--soft)}
.foot{margin-top:24px;color:var(--soft);font-size:13px;text-align:center}
</style>
</head>

/* 價格：預設值是文案上的價格；能連上報名系統時，改用系統裡的最新價格 */
let PRICES = { monthly: { MXN: 100, USD: 7 }, bimonthly: { MXN: 180, USD: 13 } };
const fmt = (n, c) => c === "MXN" ? `$${n} MXN` : `US$ ${n}`;
const priceHtml = c => {
  const row = (k, extra) => { const p = PRICES[k]; if (!p) return "";
    const parts = ["MXN", "USD"].filter(x => p[x] > 0).map(x => fmt(p[x], x)).join(" / ");
    return parts ? `<div><span>${c[k]}${extra ? " <small>(" + extra + ")</small>" : ""}</span><b>${parts}</b></div>` : ""; };
  return `<div class="price">${row("monthly")}${row("bimonthly", c.forTwo)}</div><p class="note">${c.priceNote}</p>`;
};

/* 群組報名狀態：統計頁「卡片開關」分頁設定（portalStatus 的 group-basic / group-vip，state = open / waitlist / soon / closed）*/

async function loadState(){
  try {
    const r = await fetch(`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/portalStatus?pageSize=100&key=${FB.apiKey}`);
    const j = await r.json();
    (j.documents || []).forEach(d => {
      const id = d.name.split("/").pop(), st = d.fields && d.fields.state && d.fields.state.stringValue;
      if (st && ["open", "waitlist", "soon", "closed"].includes(st)) { if (id === "group-basic") STATE.basic = st; if (id === "group-vip") STATE.vip = st; }
    });
    render();
  } catch (e) { /* 讀不到就用預設狀態 */ }
}

  return `<div class="cta">${dm}${su}</div>`;
};
let LANG = (new URLSearchParams(location.search).get("lang") || (() => { try { return localStorage.getItem("subLang"); } catch (e) { return null; } })() || "es") === "zh" ? "zh" : "es";

function render(){
  const c = C[LANG], b = c.basic, v = c.vip;
  document.documentElement.lang = LANG; document.title = c.title;
  document.querySelectorAll("#langsw [data-lang]").forEach(x => x.classList.toggle("on", x.dataset.lang === LANG));
  const feat = list => `<ul class="feat">${list.map(([i, t, d]) => `<li><span aria-hidden="true">${i}</span><div><b>${t}</b>${d}</div></li>`).join("")}</ul>`;
  document.getElementById("app").innerHTML = `
    <h1>🏋️ ${c.title}</h1>
    <p class="lead">${c.lead}</p>
    <div class="pick">
      <a href="#basico">${pill(c, "basic")}<b>${c.pickBasic[0]}</b><small>${c.pickBasic[1]}</small></a>
      <a href="#vip">${pill(c, "vip")}<b>${c.pickVip[0]}</b><small>${c.pickVip[1]}</small></a>
    </div>

    <section class="card" id="basico">
      ${pill(c, "basic")}
      <h2>${b.name}</h2><p class="pos">${b.pos}</p>
      <div class="hook"><p><strong>${b.tagline}</strong></p></div>
      <h3>${b.howTitle}</h3>${feat(b.how)}
      <h3>${b.rulesTitle}</h3><ol class="rules">${b.rules.map(r => `<li>${r}</li>`).join("")}</ol>
      <h3>💰 ${c.price}</h3><p class="note" style="margin-top:0">${c.priceSoon}</p>
      ${STATE.basic === "waitlist" ? `<p class="note">${c.waitNote}</p>` : ""}
      <div class="hook" style="margin-top:16px"><p>${b.join}</p></div>
      ${ctaBtns(c, "basic", false)}
    </section>

    <section class="card" id="vip">
      ${pill(c, "vip")}
      <h2>${v.name}</h2><p class="pos">${v.pos}</p>
      <div class="hook"><p><strong>${v.hookTitle}</strong></p>${v.hook.map(p => `<p>${p}</p>`).join("")}</div>
      <h3>${v.getTitle}</h3>${feat(v.get)}
      <p class="note">${v.weekly}</p>
      <h3>${v.rulesTitle}</h3><ol class="rules">${v.rules.map(r => `<li>${r}</li>`).join("")}</ol>
      <h3>💰 ${c.price}</h3>${priceHtml(c)}
      <p class="note">${v.screen}</p>
      ${STATE.vip === "waitlist" ? `<p class="note">${c.waitNote}</p>` : ""}
      <div class="hook" style="margin-top:16px"><p>${v.closing}</p><p>${v.how}</p></div>
      ${ctaBtns(c, "vip", true)}
    </section>

    <section class="card faq"><h2>${c.faqTitle}</h2>${c.faq.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</section>
    <p class="foot">${c.foot}</p>`;
}
document.getElementById("langsw").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; try { localStorage.setItem("subLang", LANG); } catch (x) {} render();
});
render();
loadState();

/* 嘗試取得報名系統裡的最新價格（失敗就維持上面的預設值）*/
(async () => {
  try {
    const u = new URL(API_URL); u.searchParams.set("action", "groups");
    const r = await (await fetch(u.toString())).json();
    const g = (r.groups || []).find(x => /vip/i.test(x.name || ""));
    if (!g || !g.priceTable) return;
    const t = g.priceTable, next = {};
    ["monthly", "bimonthly"].forEach(k => { const o = {}; ["MXN", "USD"].forEach(cur => { if (t[cur] && Number(t[cur][k]) > 0) o[cur] = Number(t[cur][k]); }); if (Object.keys(o).length) next[k] = o; });
    if (Object.keys(next).length) { PRICES = next; render(); }
  } catch (e) { /* 維持預設價格 */ }
})();
</script>
</body>
</html>
