<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../icon.png">
<title>團班後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css?v=5">
<link rel="stylesheet" href="admin.css?v=3">
</head>
<body>

<div id="login" hidden>
  <div class="login-card">
    <h1>團班後台</h1>
    <p>請使用授權的 Google 帳號登入。</p>
    <button class="btn primary block" data-act="login">使用 Google 登入</button>
    <p id="login-msg" class="err" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">團班後台</div>
    <div class="top-r">
      <span id="conn"></span>
      <button class="btn sm ghost" id="logout" data-act="logout" hidden>登出</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" id="tabs" aria-label="分頁"></nav>
  <main class="main" id="main"></main>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlg-title"></h2><button class="x" data-act="close" aria-label="關閉">✕</button></div>
  <div id="dlg-body" class="dlg-body"></div>
</dialog>

<dialog id="confirm">
  <div class="dlg-body">
    <div id="confirm-body"></div>
    <div class="foot"><button class="btn" id="confirm-cancel">取消</button><button class="btn primary" id="confirm-ok">確定</button></div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script src="opencc-t2cn.js"></script>
<script src="../common.js?v=5"></script>
<script type="module" src="admin.js?v=4"></script>
</body>
</html>
